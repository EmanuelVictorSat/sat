<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAT - Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="font-sans antialiased">

  <header class="sticky top-0 z-10 flex flex-wrap items-center justify-between gap-x-6 gap-y-3 border-b border-linha bg-preto px-[clamp(1.25rem,5vw,4rem)] py-4">
    <a href="index.html" class="font-display text-2xl tracking-tight">SAT</a>

    <nav aria-label="Navegação principal" class="order-3 w-full sm:order-none sm:w-auto">
      <ul class="flex gap-5 sm:gap-8">
        <li><a href="index.html" class="text-cinza transition-colors hover:text-limao">Início</a></li>
        <li><a href="cambio.html" class="text-cinza transition-colors hover:text-limao">Câmbio</a></li>
        <li><a href="emprestimos.html" class="text-cinza transition-colors hover:text-limao">Empréstimos</a></li>
      </ul>
    </nav>

    <!-- js/script.js troca este bloco quando houver sessão (nome + Sair) -->
    <div data-sessao>
      <a href="cadastro.html" class="btn">Abrir conta</a>
    </div>
  </header>

  <main class="mx-auto max-w-md px-[clamp(1.25rem,5vw,4rem)] py-[clamp(3rem,8vw,6rem)]">

    <h1 class="mb-4 font-display text-[clamp(2rem,5vw,3rem)] font-semibold leading-[1.1]">Entrar no SAT</h1>
    <p class="mb-10 text-lg text-cinza">Use seu CPF e sua senha para acessar a conta e solicitar empréstimos.</p>

    <form id="form-login" novalidate class="cartao flex flex-col gap-6">

      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="username" maxlength="14" placeholder="000.000.000-00" required aria-describedby="erro-cpf">
        <p class="campo-erro" id="erro-cpf" hidden></p>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required aria-describedby="erro-senha">
        <p class="campo-erro" id="erro-senha" hidden></p>
      </div>

      <div class="alerta" id="alerta" role="alert" hidden></div>

      <button type="submit" class="btn w-full cursor-pointer font-bold">Entrar</button>

      <p class="text-center text-sm text-cinza">Ainda não tem conta? <a href="cadastro.html" class="font-semibold text-limao underline underline-offset-4">Abrir conta</a></p>

      <p class="text-center text-xs text-cinza">Projeto acadêmico: o acesso é uma simulação feita neste navegador e não oferece segurança real.</p>

    </form>

  </main>

  <script type="module" src="js/script.js"></script>
  <script type="module" src="js/login.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
