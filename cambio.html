<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAT - Câmbio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cambio.css">
</head>

<body class="font-sans antialiased">

  <header class="sticky top-0 z-10 flex flex-wrap items-center justify-between gap-x-6 gap-y-3 border-b border-linha bg-preto px-[clamp(1.25rem,5vw,4rem)] py-4">
    <a href="index.html" class="font-display text-2xl tracking-tight">SAT</a>

    <nav aria-label="Navegação principal" class="order-3 w-full sm:order-none sm:w-auto">
      <ul class="flex gap-5 sm:gap-8">
        <li><a href="index.html" class="text-cinza transition-colors hover:text-limao">Início</a></li>
        <li><a href="cambio.html" aria-current="page" class="text-cinza transition-colors hover:text-limao">Câmbio</a></li>
        <li><a href="emprestimos.html" class="text-cinza transition-colors hover:text-limao">Empréstimos</a></li>
      </ul>
    </nav>

    <a href="/cadastro.html" class="btn">Abrir conta</a>
  </header>

  <main>
    <section id="cambio">

      <!-- Coluna da esquerda -->
      <div class="cambio-intro">
        <p class="tag">Câmbio online</p>
        <h1>Simule seu câmbio em segundos</h1>
        <p class="lead">Veja a cotação do dia e descubra quanto você paga ou recebe antes de fechar a operação.</p>

        <div class="cotacoes">
          <article class="cotacao">
            <span class="cotacao-moeda">USD · Dólar</span>
            <strong class="cotacao-valor" id="cotacao-usd">--</strong>
            <span class="cotacao-var" id="var-usd"></span>
          </article>

          <article class="cotacao">
            <span class="cotacao-moeda">EUR · Euro</span>
            <strong class="cotacao-valor" id="cotacao-eur">--</strong>
            <span class="cotacao-var" id="var-eur"></span>
          </article>
        </div>

        <p class="status" id="status" role="status" aria-live="polite">Carregando cotações...</p>
      </div>

      <!-- Simulador -->
      <form class="simulador" id="form-simulador" novalidate>
        <h2>Simulador</h2>

        <div class="operacao" role="group" aria-label="Tipo de operação">
          <button type="button" class="operacao-btn ativo" data-op="compra" aria-pressed="true">Comprar</button>
          <button type="button" class="operacao-btn" data-op="venda" aria-pressed="false">Vender</button>
        </div>

        <div class="campo">
          <label for="moeda">Moeda</label>
          <select id="moeda" name="moeda">
            <option value="USD">USD - Dólar americano</option>
            <option value="EUR">EUR - Euro</option>
          </select>
        </div>

        <div class="campo">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="0" step="any" inputmode="decimal" placeholder="Ex.: 100">
        </div>

        <button type="submit" class="btn">Simular</button>

        <div class="resultado" id="resultado" aria-live="polite">
          <p class="resultado-vazio">Informe a quantidade para ver o resultado.</p>
        </div>
      </form>

    </section>
  </main>

  <script type="module" src="js/cambio.js"></script>
</body>
</html>
